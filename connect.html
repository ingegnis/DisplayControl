<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carisma / Abbina browser</title><script src="./branding.js"></script>
<style>body{background:#142f29;color:#f2eddc;font:17px system-ui;display:grid;place-items:center;min-height:95vh;margin:0}form{width:min(490px,90vw);padding:30px;box-sizing:border-box}h1{font-size:35px}p{color:#b0c0af;line-height:1.7;font-size:14px}label{display:block;margin-bottom:10px}input,button{box-sizing:border-box;font:inherit;width:100%;padding:16px;border-radius:9px;border:1px solid #789281;margin:10px 0;background:#f4f0df;color:#21372b}input{font-size:30px;letter-spacing:7px}button{background:#db7954;color:#fff;cursor:pointer;border:0;font-size:17px}button:disabled{opacity:.5}#error{color:#f5b294}small{color:#9cb29e}</style><form id="pair"><small>CARISMA / PLAYER BROWSER</small><h1>Collega questo schermo.</h1><p>Nella regia apri <b>Collega player fisici</b>, seleziona lo schermo e genera un codice.</p><label for="code">Codice di 8 cifre</label><input id="code" inputmode="numeric" autocomplete="off" maxlength="9" required autofocus><button id="button">Abbina e avvia player</button><p id="error" role="alert"></p><p>Il browser deve restare aperto. Riavvio completamente offline su HTTP LAN non garantito: per quello serve il player Android con interfaccia inclusa.</p></form><script>'use strict';document.getElementById('pair').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('button');b.disabled=true;try{const response=await fetch('/api/player/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value,name:'Player browser'})});const r=await response.json();if(!response.ok)throw Error(r.error);localStorage.setItem('carisma-device-token',r.token);localStorage.setItem('carisma-device-screen',r.screenId);location.href='/player.html?player='+encodeURIComponent(r.screenId)+'&kiosk=1';}catch(e){document.getElementById('error').textContent=e.message;b.disabled=false;}};</script></html>
