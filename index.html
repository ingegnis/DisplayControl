.dc-time{--dc-bg:#132f2b;--dc-fg:#f1edda;--dc-soft:#adbc9e;--dc-accent:#f0a878;--dc-line:#d6dfb333;position:relative;display:block!important;aspect-ratio:16/9;width:100%;overflow:hidden;isolation:isolate;container-type:inline-size;background:var(--dc-bg)!important;color:var(--dc-fg)!important;font-family:Inter,"Segoe UI",Arial,sans-serif}
.dc-time.dc-sand{--dc-bg:#eee5d2;--dc-fg:#304438;--dc-soft:#68795f;--dc-accent:#af583b;--dc-line:#5b72552d}
.dc-time.dc-night{--dc-bg:#18243a;--dc-fg:#f3ede6;--dc-soft:#a1b1cc;--dc-accent:#b7b9f2;--dc-line:#abb9e133}
.dc-time::before{content:"";position:absolute;inset:-45%;background:radial-gradient(ellipse at 70% 56%,var(--dc-accent),transparent 43%);opacity:.12;animation:dc-breathe 18s ease-in-out infinite alternate;pointer-events:none;z-index:-1}
.dc-time::after{content:"";position:absolute;inset:0;border:1px solid var(--dc-line);pointer-events:none}
.dc-top{position:absolute;left:7%;right:7%;top:10%;display:flex;justify-content:space-between;align-items:center;font-size:1.75cqw;font-weight:600;letter-spacing:.26cqw}
.dc-brand{display:flex;align-items:center;gap:1.4cqw;white-space:nowrap}
.dc-mark{display:block;width:2.9cqw;height:2.9cqw;border:1px solid var(--dc-accent);border-radius:.65cqw;position:relative}
.dc-mark::after{content:"";position:absolute;inset:24%;border:1px solid var(--dc-accent);border-radius:50%}
.dc-local{font-size:1.4cqw;color:var(--dc-soft);letter-spacing:.2cqw;display:flex;align-items:center;gap:.9cqw}
.dc-local::before{content:"";width:.65cqw;height:.65cqw;border-radius:50%;background:var(--dc-soft)}
.dc-face{position:absolute;left:7%;top:30%;width:58%}
.dc-weekday{font-size:2.4cqw;font-weight:450;letter-spacing:.36cqw;text-transform:uppercase;color:var(--dc-soft)}

.dc-unit{display:inline-block;overflow:hidden;padding:0 .15cqw;line-height:1.08}
.dc-unit>span{display:inline-block}
.dc-colon{font-size:13cqw;line-height:1;position:relative;top:-.75cqw;margin:0 .35cqw;opacity:.65;animation:dc-pulse 2s ease-in-out infinite}
.dc-date{display:flex;align-items:baseline;gap:1.6cqw;font-size:3.1cqw;font-weight:400;letter-spacing:-.04cqw;white-space:nowrap}
.dc-year{font-size:2.2cqw;letter-spacing:.13cqw;color:var(--dc-soft)}
.dc-orbit{position:absolute;right:6.5%;top:28%;width:27cqw;aspect-ratio:1}
.dc-orbit::before{content:"";position:absolute;inset:9%;border:1px solid var(--dc-line);border-radius:50%}
.dc-orbit::after{content:"";position:absolute;inset:19%;border:1px solid var(--dc-line);border-radius:50%;opacity:.6}
.dc-track{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -0.3deg,var(--dc-soft) 0deg .7deg,transparent .7deg 6deg);mask:radial-gradient(transparent 67%,#000 67.4%,#000 69%,transparent 69.4%);opacity:.55}
.dc-orbit svg{position:absolute;inset:0;width:100%!important;height:100%!important;overflow:visible;transform:rotate(-90deg);color:var(--dc-accent)}
.dc-progress{fill:none;stroke:currentColor;stroke-width:.65;stroke-linecap:round;opacity:.7;stroke-dasharray:0 60}
.dc-orbit-dot{position:absolute;inset:0;animation:dc-revolve 60s linear infinite;animation-delay:var(--dc-delay,0s)}
.dc-orbit-dot::before{content:"";position:absolute;left:calc(50% - .5cqw);top:1.12cqw;width:1cqw;height:1cqw;border-radius:50%;background:var(--dc-accent);box-shadow:0 0 1.5cqw var(--dc-accent)}
.dc-seconds-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw}
.dc-seconds{font-size:7.5cqw;font-weight:300;line-height:1.1;letter-spacing:-.25cqw;font-variant-numeric:tabular-nums;display:block;overflow:hidden}
.dc-seconds-label{font-size:1.3cqw;letter-spacing:.3cqw;color:var(--dc-soft)}
.dc-time[data-clock-seconds="0"] .dc-seconds-wrap{opacity:0}
.dc-bottom{position:absolute;left:7%;right:7%;bottom:9%;display:flex;align-items:center;justify-content:space-between;gap:2cqw;color:var(--dc-soft);font-size:1.5cqw;letter-spacing:.13cqw}
.dc-bottom-line{flex:1;height:1px;background:var(--dc-line);max-width:22%}
.dc-zone{font-size:1.3cqw;letter-spacing:.08cqw}
@keyframes dc-revolve{to{transform:rotate(360deg)}}

<script>
/* Reusable clock renderer. Uses the device clock, including while disconnected. */
window.CarismaClock = (() => {
  'use strict';
  const formatters = new Map();
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function formatter(zone) {
    if (!formatters.has(zone)) {
      let f;
      try { f = new Intl.DateTimeFormat('it-IT', {timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
      catch { f = new Intl.DateTimeFormat('it-IT', {timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
      if (formatters.size > 40) formatters.clear();
      formatters.set(zone, f);
    }
    return formatters.get(zone);
  }
  function html({theme='forest',timezone='Europe/Rome',label='TEATRO CARISMA',showSeconds=true}={}) {
    const safeTheme = ['forest','sand','night'].includes(theme) ? theme : 'forest';
    return `<div class="visual dc-time dc-${safeTheme}" data-clock-zone="${escapeHTML(timezone)}" data-clock-seconds="${showSeconds===false?'0':'1'}" role="timer" aria-live="off" aria-label="Orologio e data">
      <div class="dc-top"><div class="dc-brand"><i class="dc-mark" aria-hidden="true"></i><span>${escapeHTML(label)}</span></div><span class="dc-local">ORA LOCALE</span></div>
      <div class="dc-face"><div class="dc-weekday" data-time-part="weekday">Oggi</div><div class="dc-digits"><span class="dc-unit"><span data-time-part="hour">--</span></span><span class="dc-colon" aria-hidden="true">:</span><span class="dc-unit"><span data-time-part="minute">--</span></span></div><div class="dc-date"><span data-time-part="date">Orologio locale</span><span class="dc-year" data-time-part="year"></span></div></div>
      <div class="dc-orbit" aria-hidden="true"><div class="dc-track"></div><svg viewBox="0 0 100 100"><circle class="dc-progress" cx="50" cy="50" r="44" pathLength="60"/></svg><div class="dc-orbit-dot"></div><div class="dc-seconds-wrap"><span class="dc-seconds" data-time-part="second">--</span><span class="dc-seconds-label">SECONDI</span></div></div>
      <div class="dc-bottom"><span>IL TUO TEMPO, QUI.</span><span class="dc-bottom-line"></span><span class="dc-zone">${escapeHTML(timezone)}</span></div>
    </div>`;
  }
  function write(el, value, animate) {
    if (el.textContent === value) return;
    const first = !el.dataset.initialized;
    el.textContent = value;
    el.dataset.initialized = '1';
    if (!first && animate && !reduced.matches && el.animate) {
      el.getAnimations().forEach(a => a.cancel());
      el.animate([{transform:'translateY(35%)',opacity:.15},{transform:'translateY(0)',opacity:1}], {duration:500,easing:'cubic-bezier(.22,1,.36,1)'});
    }
  }
  function refresh(root=document, instant=Date.now(), resync=false) {
    const clocks = [...root.querySelectorAll('.dc-time')];
    if (root.matches?.('.dc-time')) clocks.unshift(root);
    const stamp = Math.floor(instant/1000);
    const partsByZone = new Map();
    for (const clock of clocks) {
      if (clock.dataset.clockStamp === String(stamp) && !resync) continue;
      const zone = clock.dataset.clockZone || 'Europe/Rome';
      if (!partsByZone.has(zone)) partsByZone.set(zone, Object.fromEntries(formatter(zone).formatToParts(new Date(instant)).filter(p=>p.type!=='literal').map(p=>[p.type,p.value])));
      const p = partsByZone.get(zone);
      const values = {...p,date:p.day+' '+p.month};
      const first = !clock.dataset.clockStamp;
      for (const el of clock.querySelectorAll('[data-time-part]')) {
        const part = el.dataset.timePart;
        write(el,values[part]||'', ['hour','minute','second'].includes(part));
      }
      const second = Number(p.second) + (instant%1000)/1000;
      clock.querySelector('.dc-progress').style.strokeDasharray = `${second} 60`;
      if (first || resync || (clock._clockTime && Math.abs(instant-clock._clockTime)>4000)) {
        const dot=clock.querySelector('.dc-orbit-dot');
        dot.style.setProperty('--dc-delay',(-second)+'s');
        // Restart only on initial rendering, resume, or a system-clock jump.
        dot.style.animationName='none'; void dot.offsetWidth; dot.style.animationName='';
      }
      clock._clockTime=instant;
      clock.dataset.clockStamp=String(stamp);
      clock.setAttribute('aria-label',`${p.hour}:${p.minute}, ${p.weekday} ${p.day} ${p.month} ${p.year}. Fuso ${zone}.`);
    }
  }
  setInterval(() => { if (!document.hidden) refresh(); }, 250);
  document.addEventListener('visibilitychange', () => {if(!document.hidden) refresh(document,Date.now(),true);});
  return {html,refresh};
})();

</script>

iv><div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Importa immagini o video">'+icon('upload')+'<div>Trascina qui immagini o video, oppure <strong>scegli i file</strong>.</div><p style="font-size:10px;margin-top:6px">JPG, PNG, WebP, GIF, MP4, WebM / massimo 300 MB per file</p></div>');}
function renderPlaylists(){return shell('Il ritmo dei contenuti.','Sequenze locali con durata per elemento. Funzionano anche senza rete.','<button class="btn primary" data-action="new-playlist">'+icon('plus')+'Nuova playlist</button>','<div class="asset-grid">'+state.playlists.map(p=>'<article class="asset-card">'+previewVisual(getAsset(p.items[0]?.assetId))+'<div class="asset-info"><div class="asset-type">PLAYLIST LOCALE</div><h3>'+esc(p.title)+'</h3><p>'+p.items.length+' elementi / ciclo di '+p.items.reduce((n,i)=>n+(+i.duration||15),0)+' secondi</p><div class="row"><button class="btn tiny grow" data-action="edit-playlist" data-id="'+esc(p.id)+'">'+icon('edit')+'Modifica sequenza</button><button class="iconbtn" data-action="delete-playlist" data-id="'+esc(p.id)+'" aria-label="Elimina playlist">'+icon('trash')+'</button></div></div></article>').join('')+'</div><div class="help-box">Ogni elemento mantiene la durata impostata, anche se un video \u00e8 pi\u00f9 lungo o pi\u00f9 corto. Non \u00e8 un sistema di sincronizzazione al fotogramma per videowall.</div>');}
function renderSchedules(){return shell('Al momento giusto.','Palinsesti settimanali, priorit\u00e0 e gruppi. Il player usa il proprio orologio.','<button class="btn primary" data-action="new-schedule">'+icon('plus')+'Nuova programmazione</button>','<div class="notice">'+icon('clock')+'<span>Fuso orario: <strong>'+esc(state.site.timezone)+'</strong>. Un comando manuale resta attivo finch\u00e9 non premi <strong>Riprendi palinsesto</strong>.</span></div><div class="table-wrap"><table><thead><tr><th>Programmazione</th><th>Quando</th><th>Destinazione</th><th>Contenuto</th><th>Abilitata</th><th></th></tr></thead><tbody>'+state.schedules.map(r=>'<tr><td><strong>'+esc(r.title)+'</strong><small>Priorit\u00e0 '+(+r.priority||0)+(activeSchedule(r)?' / nella fascia attuale':'')+'</small></td><td><strong class="mono">'+esc(r.start)+' &ndash; '+esc(r.end)+'</strong><small>'+[1,2,3,4,5,6,0].filter(d=>r.days.includes(d)).map(d=>DAYS[d]).join(', ')+'</small></td><td>'+r.screenIds.length+' schermi<small>'+esc(state.screens.filter(s=>r.screenIds.includes(s.id)).map(s=>s.name).join(', '))+'</small></td><td>'+esc(contentLabel(r.content))+'<small>'+esc(r.content.type==='playlist'?'Playlist':'Schermata / file')+'</small></td><td><button role="switch" aria-checked="'+!!r.enabled+'" aria-label="Abilita '+esc(r.title)+'" class="switch '+(r.enabled?'on':'')+'" data-action="toggle-schedule" data-id="'+esc(r.id)+'"></button></td><td><div class="row"><button class="iconbtn" data-action="edit-schedule" data-id="'+esc(r.id)+'" aria-label="Modifica programmazione">'+icon('edit')+'</button><button class="iconbtn" data-action="delete-schedule" data-id="'+esc(r.id)+'" aria-label="Elimina programmazione">'+icon('trash')+'</button></div></td></tr>').join('')+'</tbody></table>'+(state.schedules.length?'':'<div class="empty"><h3>Nessun palinsesto configurato</h3><p>Aggiungi una programmazione settimanale.</p></div>')+'</div><div class="two-cols" style="margin-top:20px"><div class="settings-card"><h2>Qua function renderDiagnostics(){return shell('Sai sempre cosa sta succedendo.','Distinguiamo le funzioni gi\u00e0 operative dalle integrazioni ancora da costruire.','<button class="btn" data-action="refresh">'+icon('refresh')+'Aggiorna stato</button>','<div class="two-cols"><div class="settings-card"><h2>Componenti del sistema</h2><p>Nessuno stato hardware viene simulato come se fosse reale.</p>'+[['Controller',mode==='server'?'Python + SQLite':'Browser + IndexedDB','green'],['Collegamento al server',mode==='server'?(serverReachable?'Raggiungibile':'Non raggiungibile'):'Non necessario in modalit\u00e0 file',serverReachable?'green':'orange'],['Player di prova','Browser / operativi','green'],['Gateway NDI',mode==='server'?(ndiInfo?.runtime?.available?'Runtime presente / verificare flusso':'Verifica Ingressi NDI'):'Richiede server locale',ndiInfo?.runtime?.available?'green':'orange'],['App Chromecast','Sorgenti alpha / APK da compilare e collaudare','orange'],['Firmware G454V','Non modificato',''],['Internet','Non richiesto dall\u2019app','green']].map(([k,v,c])=>'<div class="status-line"><span>'+esc(k)+'</span><span class="pill '+c+'">'+esc(v)+'</span></div>').join('')+'</div><div class="settings-card"><h2>Test di autonomia</h2><p>Apri un player, aspetta \u201cCache pronta\u201d e usa il pulsante \u201cSimula rete assente\u201d nel player. Modifica il contenuto dalla regia: il player isolato continua con il programma precedente. Ripristina la rete per ricevere il comando nuovo.</p><div class="help-box">Il test interrompe davvero la sincronizzazione del player. Non spegne la scheda di rete del computer. Puoi anche arrestare il server o staccare la LAN per provare la perdita reale del collegamento.</div><div class="build-note">Su localhost il service worker conserva anche l\u2019app per il riavvio offline del browser. Via HTTP su un altro indirizzo LAN il riavvio offline non \u00e8 garantito. Il player Android alpha include la pagina nel pacchetto; riavvio e cache su Chromecast restano da collaudare.</div><button class="btn primary" data-action="player" data-id="'+esc(state.screens[0]?.id||'')+'">'+icon('external')+'Apri il primo player</button></div></div><div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Player</th><th>Stato</th><th>Contenuto dichiarato</th><th>File in cache</th><th>Ultimo segnale</th></tr></thead><tbody>'+state.screens.map(s=>{const h=runtime[s.id],st=statusFor(s.id);return '<tr><td><strong>'+esc(s.name)+'</strong><small>'+esc(s.id)+'</small></td><td><span class="pill '+st.className+'">'+st.text+'</span></td><td>'+esc(h?.title||'Nessun player aperto')+'</td><td>'+(h?h.cacheCount:'&mdash;')+'</td><td>'+(h?timeText(h.lastSeen*1000):'&mdash;')+'</td></tr>';}).join('')+'</tbody></table></div><div class="settings-card" style="margin-top:20px"><h2>Registro operazioni</h2><div style="margin-top:12px">'+(state.events||[]).slice(0,20).map(e=>'<div class="status-line"><span>'+esc(e.text)+'</span><small class="mono">'+timeText(e.at)+'</small></div>').join('')+'</div></div>');}
function renderSettings(){return shell('Le basi della tua regia.','Configurazione locale e passaggio dal prototipo al server Debian.','',''+OrganizationBranding.editorMarkup()+'<div class="two-cols"><div class="settings-card"><h2>Progetto</h2><p>Le impostazioni vengono conservate nel database locale della modalit\u00e0 attuale.</p><form id="settings-form" class="stack"><div class="field"><label for="site-name">Nome dell’organizzazione</label><input id="site-name" required maxlength="80" value="'+esc(state.site.name)+'"></div><div class="field"><label for="site-zone">Fuso orario IANA</label><input id="site-zone" required value="'+esc(state.site.timezone)+'"></div><div class="field"><label for="site-cache">Quota predefinita di cache per i nuovi player (MB)</label><input type="number" id="site-cache" required min="20" max="10000" value="'+(+state.site.defaultCacheMb||750)+'"><small>Limite del progetto, non una prenotazione dello spazio del browser.</small></div><div><button class="btn primary" type="submit">Salva impostazioni</button></div></form></div><div class="stack"><div class="settings-card"><h2>Backup e trasferimento</h2><p>Esporta schermate, schermi, playlist e palinsesti. Il JSON non contiene i file video e immagine: vanno reimportati. Nel server, il backup completo \u00e8 la cartella <code>data/</code>.</p><div class="row" style="flex-wrap:wrap"><button class="btn" data-action="export">'+icon('download')+'Esporta JSON</button><button class="btn" data-action="import-config">'+icon('upload')+'Importa JSON</button></div></div><div class="settings-card"><h2>Ambiente di esecuzione</h2><p>'+(mode==='server'?'Server Python locale con SQLite. Chiave di accesso richiesta per API e file. HTTP non cifrato: usare soltanto su rete fidata.':'File HTML autonomo. Il browser conserva i dati su questo computer. Per pi\u00f9 postazioni e dati centralizzati, avvia il server incluso nel pacchetto.')+'</p><div class="row"><span class="pill green">'+(mode==='server'?'SERVER LOCALE' function bindView(){const input=document.getElementById('asset-search');if(input)input.addEventListener('input',()=>{const q=input.value.toLowerCase();document.querySelectorAll('[data-asset-title]').forEach(el=>el.classList.toggle('hidden',!el.dataset.assetTitle.includes(q)));});const dz=document.getElementById('dropzone');if(dz){dz.onclick=()=>document.getElementById('media-picker').click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')document.getElementById('media-picker').click();};dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};dz.ondragleave=()=>dz.classList.remove('drag');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');uploadFiles([...e.dataTransfer.files]);};}const readBranding=OrganizationBranding.bindEditor(state.site);const form=document.getElementById('settings-form');if(form)form.onsubmit=async e=>{e.preventDefault();const zone=document.getElementById('site-zone').value.trim();try{new Intl.DateTimeFormat('it',{timeZone:zone});}catch{toast('Fuso orario non valido.',true);return;}await commit(s=>{s.site.name=document.getElementById('site-name').value.trim();s.site.branding=readBranding();s.site.timezone=zone;s.site.defaultCacheMb=+document.getElementById('site-cache').value;},'Impostazioni del progetto aggiornate.');};}

}

// Conservative fallback for a pre-0.5.1 server. All numeric fields are bounded.
function livePlaybackPolicy(value){
 const v=value||{},number=(key,fallback,low,high)=>{

  targetBufferSeconds:target,maxBufferSeconds:Math.max(target+.4,number('maxBufferSeconds',5,.8,8)),
  pollMs:number('pollMs',500,80,1000),initialSegments:Math.round(number('initialSegments',3,2,6))};
}
function livePosition(begin,end,current,started,force,policy){
 const gap=end-current;
 const seek=force||!started||current<begin||current>end||gap>policy.maxBufferSeconds;
 return {seek,time:Math.min(end-.02,Math.max(begin+.02,end-policy.targetBufferSeconds)),gap};
}

     if(this.closed)return;

   text(ctx,p('date'),34,210,16,fg,230);text(ctx,p('year'),217,210,12,soft,60);
   ctx.strokeStyle=soft;ctx.globalAlpha=.4;ctx.lineWidth=1;
   for(const r of [57,46,36]){ctx.beginPath();ctx.arc(384,140,r,0,Math.PI*2);ctx.stroke();}
   ctx.globalAlpha=1;ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();ctx.arc(384,140,57,-Math.PI/2,-Math.PI/2+Math.PI*2*Number(p('second'))/60);ctx.stroke();
   if(c.dataset.clockSeconds!=='0'){text(ctx,p('second'),365,151,32,fg,60);text(ctx,'SECONDI',366,169,6,soft,55);}
   text(ctx,'IL TUO TEMPO, QUI.',34,245,7,soft);text(ctx,c.dataset.clockZone,376,245,7,soft,80);
   return;
  }
  const visual=root.querySelector('.visual');

  lines(ctx,visual.querySelector('.poster-sub')?.innerText,40,196,12,fg,18,390,3);

 }
 function sample(){
  const root=document.getElementById('player-canvas');
  const a=playerState.displayedAsset,report={screenId:playerId,title:playerState.effectiveTitle,
   revision:playerState.revision,assetId:a?.id||'',assetKind:playerState.displayedBlack?'black':a?.kind||'',
   fallback:!!playerState.displayedFallback,offlineTest:playerState.testOffline,message:playerState.message,
   hidden:document.hidden,kind:'unavailable',jpeg:'',error:''};
  const canvas=document.createElement('canvas');canvas.width=480;canvas.height=270;
  const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#000';ctx.fillRect(0,0,480,270);
  try{
   if(!root)throw Error('Player in avvio.');
   const video=root.querySelector('video'),image=root.querySelector('img');
   if(video){
    report.mediaTime=video.currentTime;report.paused=video.paused;
    if(video.buffered.length)report.bufferSeconds=Math.max(0,video.buffered.end(video.buffered.length-1)-video.currentTime);
    if(video.readyState<2)throw Error('In attesa del primo fotogramma.');
    fit(ctx,video,480,270);report.kind='frame';
   }else if(image){if(!image.complete)throw Error('Immagine in caricamento.');fit(ctx,image,480,270);report.kind='frame';}
   else if(root.querySelector('.visual.black')){report.kind='black';}
   else{reconstructed(ctx,root);report.kind='rendered';}
   report.jpeg=canvas.toDataURL('image/jpeg',.58).split(',')[1];
   if(report.jpeg.length>87384)report.jpeg=canvas.toDataURL('image/jpeg',.3).split(',')[1];
   if(report.jpeg.length>87384)throw Error('Miniatura troppo grande.');
  }catch(error){report.kind='unavailable';report.jpeg='';report.error=String(error.message||error).slice(0,240);}
  return report;
 }
 async function send(){
  if(busy||!playerId||mode!=='server'||playerState.testOffline||!playerState.snapshot||performance.now()>enabledUntil)return;
  busy=true;nextAt=performance.now()+interval*1000;
  try{const reply=await apiJSON('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sample()),timeout:2500});configure(reply.monitor);}
  catch{/* Thumbnail failure must not interrupt playback. */}finally{busy=false;}
 }
 function start(){if(started)return;started=true;setInterval(()=>{if(performance.now()>=nextAt)send();},200);}
 return {configure,start,sample,send};
})();

async function heartbeat(){if(!playerId)return;const data={screenId:playerId,lastSeen:Date.now()/1000,title:playerState.effectiveTitle||'In avvio',cacheCount:playerState.cacheCount,revision:playerState.revision,offlineTest:playerState.testOffline,message:playerState.message};if(mode==='server'){try{const reply=await apiJSON('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),timeout:2500});CarismaPreview.configure(reply.monitor);}catch{}}else{safeLocal.set('carisma-heartbeat-'+playerId,JSON.stringify(data));}}
async function syncPlayer(){if(playerState.syncing)return;playerState.syncing=true;try{if(playerState.testOffline){playerState.connected=false;playerState.message='Sincronizzazione sospesa / test offline';renderPlayer();await heartbeat();return;}let candidate,rev=0;if(mode==='server'){const r=await apiJSON('/api/state',{timeout:3500});candidate=r.state;rev=r.revision;}else{candidate=localState()||state;rev=0;}if(!validState(candidate))throw Error('Nessun programma valido pubblicato dal controller.');const screen=candidate.screens.find(s=>s.id===playerId);if(!screen)throw Error('Postazione non presente nel progetto.');const signature=JSON.stringify(candidate);if(signature!==playerState.lastSignature){playerState.message='Preparazione della cache locale...';renderPlayerStatus();const count=await ensurePlayerCache(candidate,screen);await dbput('snapshots',playerId,{state:candidate,revision:rev,savedAt:Date.now(),cacheCount:count});playerState.snapshot=clone(candidate);playerState.lastSignature=signature;playerState.revision=rev;playerState.cacheCount=count;state=playerState.snapshot;}playerState.connected=true;playerState.message='Cache pronta / programma locale valido';renderPlayer();await heartbeat();}catch(err){playerState.connected=false;playerState.message=playerState.snapshot?'Regia non disponibile / ultimo programma conservato':err.message;if(playerState.snapshot&&/quota|File|Dimensione|SHA|programma|Postazione/.test(err.message))playerState.message=err.message+' Ultimo programma conservato.';renderPlayer();}finally{playerState.syncing=false;renderPlayerStatus();}}
function renderPlayerStatus(){const s=playerState.snapshot?.screens.find(s=>s.id===playerId);const status=document.getElementById('player-status');if(status){status.className='player-badge'+(!playerState.connected?' offline':'');status.innerHTML=icon(playerState.connected?'wifi':'offline')+' <span>'+(playerState.testOffline?'TEST OFFLINE':playerState.connected?'CONNESSO ALLA REGIA':'AUTONOMO / REGIA ASSENTE')+'</span>';}const name=document.getElementById('player-name');if(name)name.textContent=(s?.name||playerId)+' / '+(playerState.effectiveTitle||'In avvio');const desc=document.getElementById('player-desc');if(desc)desc.textContent=playerState.message+' / '+playerState.cacheCount+' file in cache / schermate incluse';const b=document.getElementById('player-offline-button');if(b)b.innerHTML=icon(playerState.testOffline?'wifi':'offline')+(playerState.testOffline?'Ripristina collegamento':'Simula rete assente');}
function failLive(message){
 playerState.liveRetryAt=Date.now()+6000;playerState.liveError=message;playerState.message=message+' / fallback locale';
 playerState.ndiClient?.stop();playerState.ndiClient=null;playerState.activeKey='';renderPlayer();
}
function renderPlayer(){
 OrganizationBranding.apply(state.site);
 const canvas=document.getElementById('player-canvas');if(!canvas)return;
 const s=playerState.snapshot,screen=s?.screens.find(x=>x.id===playerId);
 if(!screen){canvas.innerHTML='<div class="player-error"><h1>Player in attesa di un programma.</h1><p>'+esc(playerState.message)+'</p><p>Apri la console, configura questa postazione e lascia completare la prima sincronizzazione.</p></div>';renderPlayerStatus();return;}
 const r=resolveScreen(screen,s),live=r.asset?.kind==='live';let asset=r.asset,isHTTP=false,isNDI=false,reason='';
 if(live){
  if(playerState.testOffline||!playerState.connected)reason='Regia o rete assente';
  else if(Date.now()<playerState.liveRetryAt)reason=playerState.liveError||'Segnale video non disponibile';
  else if(['ndi','ndi-test'].includes(r.asset.protocol)){
   if(mode!=='server')reason='Avvia il server locale per ricevere NDI';else isNDI=true;
  }else if(!/^https?:\/\//i.test(r.asset.url||''))reason='URL video non valido';else isHTTP=true;
  if(reason)asset=r.fallback;
 }
 const key=(r.isBlack?'black':isNDI?'ndi:'+JSON.stringify(r.asset):isHTTP?'http:'+r.asset.id+':'+r.asset.url:JSON.stringify(asset))+'|'+reason;
 playerState.effectiveTitle=r.isBlack?'Schermo nero':(asset?.title||'Nessun contenuto')+(reason?' / fallback: '+reason:'');
 playerState.displayedAsset=asset;playerState.displayedBlack=r.isBlack;playerState.displayedFallback=!!reason;
 if(key===playerState.activeKey){renderPlayerStatus();return;}
 playerState.ndiClient?.stop();playerState.ndiClient=null;playerState.activeKey=key;playerState.liveElement=null;
 if(isHTTP||isNDI){
  canvas.innerHTML='<div class="visual media"><video id="live-video" autoplay muted playsinline></video>'+(isNDI?'<span class="ndi-live-label">'+(r.asset.protocol==='ndi-test'?'TEST LOCALE / NON NDI':'NDI / GATEWAY LOCALE')+'</span>':'')+'</div>';
  const v=document.getElementById('live-video');v.muted=!playerState.audioEnabled;playerState.liveElement=v;playerState.lastProgress=Date.now();
  v.addEventListener('timeupdate',()=>{if(playerState.liveElement===v)playerState.lastProgress=Date.now();});
  if(isNDI){
   playerState.liveGraceUntil=Date.now()+18000;
   const client=new CarismaLiveClient(v,r.asset,{status:text=>{if(playerState.liveElement===v){playerState.message=text;renderPlayerStatus();}},error:message=>{if(playerState.liveElement===v)failLive(message);}});
   playerState.ndiClient=client;client.start();
  }else{
   playerState.liveGraceUntil=Date.now()+7000;
   v.addEventListener('error',()=>{if(v.isConnected)failLive('Errore di riproduzione live');});
   v.addEventListener('ended',()=>{if(v.isConnected)failLive('Flusso terminato');});v.src=r.asset.url;
   v.play().catch(()=>{if(v.isConnected)failLive('Avvio del video non riuscito');});
  }
 }else{
  canvas.innerHTML=previewVisual(asset,{black:r.isBlack});CarismaClock.refresh(canvas);
  if(asset&&(asset.kind==='image'||asset.kind==='video')&&!r.isBlack){const el=canvas.querySelector('[data-media]');(async()=>{try{const blob=await dbget('media',asset.fileId);if(!blob)throw Error('File locale mancante');const src=objectURLs.get(asset.fileId)||URL.createObjectURL(blob);objectURLs.set(asset.fileId,src);if(el?.isConnected){el.src=src;if(asset.kind==='video'){el.loop=true;el.muted=true;el.autoplay=true;el.playsInline=true;el.onloadeddata=()=>el.previousElementSibling?.classList.add('hidden');await el.play();}else el.onload=()=>el.previousElementSibling?.classList.add('hidden');}}catch(err){playerState.message=err.message+' / verificare codec e cache';const fb=r.fallback;if(fb?.kind==='poster'||fb?.kind==='clock'){canvas.innerHTML=previewVisual(fb);playerState.displayedAsset=fb;playerState.displayedFallback=true;playerState.effectiveTitle=fb.title+' / fallback file locale';CarismaClock.refresh(canvas);}renderPlayerStatus();}})();}
 }
 renderPlayerStatus();
}

async function initPlayer(){document.title='Player / '+playerId+' / Carisma';document.body.className='player-body'+(isKiosk?' kiosk':'');document.getElementById('app').innerHTML='<main id="player-canvas" class="player-root"></main><div id="player-status" class="player-badge">Avvio...</div><div class="player-hud"><div><strong id="player-name">'+esc(playerId)+'</strong><small id="player-desc">Preparazione della cache...</small></div><div class="row"><button class="btn" data-action="player-live-edge" title="Recupera il ritardo rispetto al video disponibile sul server">Torna alla diretta</button><button class="btn" data-action="player-audio">Attiva audio</button><button class="btn" id="player-offline-button" data-action="player-offline">'+icon('offline')+'Simula rete assente</button><button class="btn" data-action="player-fullscreen" title="Schermo intero">'+icon('expand')+'</button><button class="btn" data-action="player-controls" title="Nascondi controlli. Esc per mostrarli.">'+icon('x')+'</button></div></div><button class="player-show-controls" data-action="player-controls">Mostra controlli</button>';try{const saved=await dbget('snapshots',playerId);if(saved&&validState(saved.state)){playerState.snapshot=saved.state;playerState.revision=saved.revision;playerState.cacheCount=saved.cacheCount||0;state=saved.state;playerState.message='Programma recuperato dalla memoria locale.';}}catch(err){playerState.message='Cache del browser non disponibile: '+err.message;}renderPlayer();await syncPlayer();CarismaPreview.start();setInterval(syncPlayer,2500);setInterval(()=>{if(playerState.liveElement&&Date.now()>playerState.liveGraceUntil&&Date.now()-playerState.lastProgress>7000)failLive('Flusso fermo da oltre 7 secondi');renderPlayer();},500);if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});}
function showPair(error=''){document.getElementById('app').innerHTML='<div class="loader"><form id="pair-form" class="pair-card"><div class="brand-mark">'+icon('lock')+'</div><h1 style="font-size:24px;margin:18px 0 10px">La tua regia, in locale.</h1><p>Inserisci la chiave stampata nella finestra del server. La trovi anche nel file <code>data/access.key</code>.</p><div class="field"><label for="pair-key">Chiave di accesso locale</label><input id="pair-key" type="password" required autocomplete="off"></div>'+(error?'<div class="alert-error">'+esc(error)+'</div>':'')+'<button class="btn primary full" style="margin-top:16px" type="submit">Apri la regia'+icon('arrow')+'</button><p style="margin:15px 0 0;font-size:10px">Nessun account Google. Nessuna connessione Internet richiesta.</p></form></div>';document.getElementById('pair-form').onsubmit=async e=>{e.preventDefault();token=document.getElementById('pair-key').value.trim();safeLocal.set(TOKEN_KEY,token);await boot();};}
async function boot(){
 mode=(location.protocol==='file:'||params.get('demo')==='1')?'standalone':'server';
 const suppliedKey=params.get('key');if(suppliedKey){token=suppliedKey;safeLocal.set(TOKEN_KEY,token);const u=new URL(location.href);u.searchParams.delete('key');history.replaceState(null,'',u);params.delete('key');}else token=token||safeLocal.get(TOKEN_KEY)||'';
 state=localState()||defaultState();
 if(mode==='server'){
  if(!token){showPair();return;}
  try{const r=await apiJSON('/api/state');revision=r.revision;if(r.state){if(!validState(r.state))throw Error('Il progetto sul server non \u00e8 valido.');state=r.state;}else if(!playerId){const saved=await apiJSON('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,state})});revision=saved.revision;}serverReachable=true;safeLocal.set(STORE,JSON.stringify(state));}
  catch(err){serverReachable=false;if(err.status===401){showPair(err.message);return;}if(!playerId&&!localState()){showPair('Server non raggiungibile. Avvia server.py e riprova.');return;}}
 }else{if(!localState())safeLocal.set(STORE,JSON.stringify(state));}
  if(!playerId&&installClockBuiltin(state)){
   if(mode==='server'&&serverReachable){try{const r=await apiJSON('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,state})});revision=r.revision;}catch(err){console.warn('Orologio locale: salvataggio sul server non riuscito.',err.message);}}
   safeLocal.set(STORE,JSON.stringify(state));
  }
 if('serviceWorker' in navigator&&mode==='server'&&window.isSecureContext)navigator.serviceWorker.register('./sw.js').catch(()=>{});
 if(playerId){await initPlayer();return;}
 selected=new Set(state.screens.slice(0,1).map(s=>s.id));render();await refreshController();setInterval(refreshController,2500);setInterval(()=>{const el=document.getElementById('app-clock');if(el)el.textContent=timeText()+' / '+state.site.timezone;},15000);
}
boot().catch(err=>{console.error(err);document.getElementById('app').innerHTML='<div class="loader"><div class="pair-card"><h1>Avvio non riuscito.</h1><p>'+esc(err.message)+'</p><p>Usa il server incluso nel pacchetto se il browser limita l\u2019accesso ai file locali.</p></div></div>';});
</script>
